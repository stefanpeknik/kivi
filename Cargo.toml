[package]
name = "kivi"
version = "0.0.0-dev"
edition = "2024"
description = "A fast, ergonomic CLI for HashiCorp Vault KV v2 secrets"
license = "MIT"
repository = "https://github.com/stefanpeknik/kivi"
rust-version = "1.85"

[[bin]]
name = "kivi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "process", "time", "io-std", "io-util", "macros"] }
toml = "0.8"
dialoguer = "0.11"
console = "0.15"
comfy-table = "7"
ptree = "0.4"
similar = { version = "2", features = ["inline"] }
tempfile = "3"
thiserror = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
